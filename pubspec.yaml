name: ev_charge_navigator
description: "EV Charge Navigator - Smart charging for your journey"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7

  # Maps
  mapbox_maps_flutter: ^2.4.0

  # Location
  geolocator: ^13.0.2
  permission_handler: ^11.4.0

  # State Management
  provider: ^6.1.2

  # Networking
  http: ^1.3.0

  # Utilities
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/ev_icon_v2.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/ev_logo_clean.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
